name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run agent:docs

      # Baseline ENG-001 ainda contém erros preexistentes. O lint permanece visível,
      # mas não bloqueia até que a limpeza por domínio seja concluída.
      - run: npm run lint
        continue-on-error: true

      - run: npm run agent:changed
      - run: npm run agent:architecture
      - run: npm run agent:security
      - run: npm run agent:performance

      - run: npm run type-check

      - run: npm test

      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
