product: CRM de corretora de planos de saúde (AncoraHub); corretores, supervisores e diretoria usam o dia todo
personality: [amigável, direto, feito à mão]
sizes: [16, 20, 24]
dir: src/components/icons
avoid: [letras ou números dentro do ícone, cifrão para dinheiro]
dna:
  style: outline
  stroke: 2.5  # marcador de quadro branco: traço grosso
  grid: 24
  padding: 1
  keylines: { circle: 20, square: 18, portrait: [16, 20], landscape: [20, 16] }
  corners: { family: circular, radius: { large: 3, small: 1.5 }, largeThreshold: 8 }
  caps: round
  joins: round
  angles: [0, 45, 90]
  detail: low
  minGap: 2
  badge: { position: bottom-right, size: 8, gap: 2 }
